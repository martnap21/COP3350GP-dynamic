name: Blackjack tests
on:
  push:
    branches: [main, feature/simple-blackjack-with-betting]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check blackjack.js
          node --check app.js
      - name: Blackjack rules and payouts
        run: node --test
