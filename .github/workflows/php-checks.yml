name: PHP poker checks
on:
  push:
    branches: [main, feature/real-sites-mvp]
  pull_request:
jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Syntax checks
        run: |
          php -l index.php
          php -l api.php
          php -l lib.php
          php -l tests/hand-rankings.php
      - name: Poker engine checks
        run: php tests/hand-rankings.php
      - name: Simulated two-browser game
        run: bash tests/multiplayer-smoke.sh
