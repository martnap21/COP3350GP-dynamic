<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A straightforward game of blackjack against the dealer.">
  <title>Blackjack</title>
  <script>
    // Set the preferred theme before the page paints.
    (() => {
      let saved;
      try { saved = localStorage.getItem('blackjack-theme'); } catch {}
      const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme =
        saved === 'light' || saved === 'dark' ? saved : (systemDark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="Blackjack home">BJ<span class="wordmark-dot">.</span></a>
      <div class="theme-control" role="group" aria-label="Appearance">
        <button type="button" id="theme-light" class="theme-option" aria-pressed="false">Light</button>
        <button type="button" id="theme-dark" class="theme-option" aria-pressed="false">Dark</button>
      </div>
    </header>

    <main>
      <div class="intro">
        <h1>Blackjack</h1>
        <p>Twenty-one. Nothing complicated.</p>
      </div>

      <section class="game" aria-label="Blackjack game">
        <div class="game-meta">
          <div class="stat">
            <span class="stat-label">Your balance</span>
            <span class="stat-value"><strong id="balance">500</strong> <span>chips</span></span>
          </div>
          <div class="stat stat-right">
            <span class="stat-label">On the table</span>
            <span class="stat-value"><strong id="wager">0</strong> <span>chips</span></span>
          </div>
        </div>

        <div class="hands">
          <div class="hand">
            <div class="hand-heading">
              <h2>Dealer</h2>
              <span class="total" aria-label="Dealer total">Total <strong id="dealer-total">—</strong></span>
            </div>
            <div id="dealer-cards" class="cards" aria-label="Dealer cards"></div>
          </div>

          <p id="result" class="result" role="status" aria-live="polite">Choose your bet and deal.</p>

          <div class="hand">
            <div class="hand-heading">
              <h2>Your hand</h2>
              <span class="total" aria-label="Your total">Total <strong id="player-total">—</strong></span>
            </div>
            <div id="player-cards" class="cards" aria-label="Your cards"></div>
          </div>
        </div>

        <div class="controls" aria-label="Game controls">
          <form id="deal-form" class="action-row">
            <label for="bet-amount">Bet</label>
            <div class="bet-field">
              <input id="bet-amount" name="bet" type="number" min="10" max="500" step="10" value="20" required>
              <span>chips</span>
            </div>
            <button id="deal-button" type="submit" class="primary">Deal cards</button>
          </form>
          <div id="play-actions" class="action-row" hidden>
            <button id="hit-button" type="button" class="primary">Hit</button>
            <button id="stand-button" type="button" class="secondary">Stand</button>
          </div>
          <p id="no-chips" class="help" hidden>Not enough chips to bet. Reset to start again.</p>
        </div>
      </section>
      <div class="after-game">
        <p>Dealer stands on 17. Blackjack pays 3:2.</p>
        <button id="reset-button" type="button" class="reset">Reset chips</button>
      </div>
    </main>

    <footer>Just for fun. No real money.</footer>
  </div>
</body>
</html>
